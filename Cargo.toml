[package]
name = "neti-eckart"
version = "0.1.0"
edition = "2021"
authors = ["Sabrina Hackfort"]
description = "NETI: accurate Eckart tunnelling transmission coefficients without cancellation, with the small-barrier (cos) branch, validated against certified ball-arithmetic references"
license = "Apache-2.0"
repository = "https://github.com/sectio-aurea-q/neti"
keywords = ["tunnelling", "kinetics", "eckart", "chemistry", "numerics"]

[lib]
name = "neti"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "neti"
path = "src/main.rs"

[dependencies]
